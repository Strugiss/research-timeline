[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-timeline"
version = "0.2.5"
description = "Track, visualize, and export research timelines from first AI interaction to scientific discovery"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alessandro Tulli", email = "2injob.at2@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/Strugiss/research-timeline"
Repository = "https://github.com/Strugiss/research-timeline"
Issues = "https://github.com/Strugiss/research-timeline/issues"

[project.scripts]
research-timeline = "research_timeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_timeline = ["*.json"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]