site_name: research-timeline
site_description: Track, validate, and export research timelines — from first AI interaction to scientific discovery
site_url: https://strugiss.github.io/research-timeline/
repo_url: https://github.com/Strugiss/research-timeline
repo_name: Strugiss/research-timeline
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - File Format: file-format.md
  - Examples: examples.md
  - AI Disclosure: ai-disclosure.md
  - About: about.md
